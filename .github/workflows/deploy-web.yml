name: Publicar app web (GitHub Pages)

# Cada push a main publica la app web. Tambien se puede lanzar a mano
# desde Actions -> "Publicar app web" -> Run workflow.
#
# Requisitos (una sola vez):
#  1. Settings -> Pages -> Source: "GitHub Actions".
#  2. Settings -> Secrets and variables -> Actions:
#       EXPO_PUBLIC_SUPABASE_URL        (Supabase de Viva -> Project Settings -> API)
#       EXPO_PUBLIC_SUPABASE_ANON_KEY   (la clave PUBLICABLE, nunca la secreta)
#       EXPO_PUBLIC_RESTAURANT_ID       (opcional; si falta se usa el de app.json)
#  3. Solo con dominio propio (p. ej. app.vivajuicecoffee.com): crear la
#     VARIABLE de repositorio WEB_BASE_URL con valor "/". Sin ella se
#     asume la URL de Pages: https://<cuenta>.github.io/<repo>/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Compilar la app web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Comprobar que los secretos existen
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ] && missing="$missing EXPO_PUBLIC_SUPABASE_URL"
          [ -z "$SUPABASE_KEY" ] && missing="$missing EXPO_PUBLIC_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos del repositorio:$missing"
            echo "Se crean en Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          # Todo lo que entra en la app web lo puede leer cualquiera que
          # abra la pagina. Una clave secreta aqui seria un incidente.
          case "$SUPABASE_KEY" in
            sb_secret_*)
              echo "::error::EXPO_PUBLIC_SUPABASE_ANON_KEY contiene una clave SECRETA. Usa la publicable."
              exit 1
              ;;
          esac
          echo "Secretos presentes."

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint, typecheck y tests
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Ruta base
        id: base
        env:
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
          REPO: ${{ github.event.repository.name }}
        run: |
          # Con dominio propio la app vive en la raiz ("/" -> ""); en
          # GitHub Pages sin dominio, bajo /<repo>.
          if [ -n "$WEB_BASE_URL" ]; then
            base="${WEB_BASE_URL%/}"
          else
            base="/$REPO"
          fi
          echo "value=$base" >> "$GITHUB_OUTPUT"
          echo "Ruta base: '${base:-/}'"

      - name: Exportar la app web
        working-directory: apps/mobile
        env:
          CI: '1'
          EXPO_WEB_BASE_URL: ${{ steps.base.outputs.value }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_RESTAURANT_ID: ${{ secrets.EXPO_PUBLIC_RESTAURANT_ID }}
          EXPO_PUBLIC_APP_ENV: production
        run: pnpm build:web

      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/mobile/dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
